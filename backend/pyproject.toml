[project]
name = "eagle-eye"
version = "0.1.0"
description = "Autonomous golf course vectorization platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "httpx>=0.27.0",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
    "numpy>=2.1.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
gis = [
    "geopandas>=1.0.1",
    "pyogrio>=0.10.0",
    "fiona>=1.10.0",
    "rasterio>=1.4.0",
]
ml = [
    "onnxruntime>=1.20.0",
]
workers = [
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
